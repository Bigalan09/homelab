hostname: mgmt-router-01

system:
  hostname: mgmt-router-01
  timezone: UTC

network:
  wan:
    type: interface
    device: eth0
    proto: dhcp

  management:
    type: interface
    device: eth1.99
    proto: static
    ipaddr: 10.10.99.1
    netmask: 255.255.255.0

  server:
    type: interface
    device: eth1.10
    proto: static
    ipaddr: 10.10.10.1
    netmask: 255.255.255.0

  lan:
    type: interface
    device: eth1.20
    proto: static
    ipaddr: 10.10.20.1
    netmask: 255.255.255.0

  iot:
    type: interface
    device: eth1.30
    proto: static
    ipaddr: 10.10.30.1
    netmask: 255.255.255.0

  guest:
    type: interface
    device: eth1.40
    proto: static
    ipaddr: 10.10.40.1
    netmask: 255.255.255.0

  tv:
    type: interface
    device: eth1.50
    proto: static
    ipaddr: 10.10.50.1
    netmask: 255.255.255.240

  work:
    type: interface
    device: eth1.60
    proto: static
    ipaddr: 10.10.60.1
    netmask: 255.255.255.240

wireless:
  radios:
    radio0:
      type: mac80211
      channel: 6
      country: GB
      band: 2g
      htmode: HE40

    radio1:
      type: mac80211
      channel: 36
      country: GB
      band: 5g
      htmode: HE80

  interfaces:
    wifi_mgmt_2g:
      device: radio0
      mode: ap
      ssid: Meerkat Manor Admin
      encryption: psk2
      key: changeme
      disabled: 1

    wifi_mgmt_5g:
      device: radio1
      mode: ap
      ssid: Meerkat Manor Admin
      encryption: psk2
      key: changeme
      disabled: 1

dhcp:
  management:
    start: 50
    limit: 50
    leasetime: 12h

  server:
    start: 50
    limit: 150
    leasetime: 24h

  lan:
    start: 50
    limit: 150
    leasetime: 12h

  iot:
    start: 50
    limit: 150
    leasetime: 12h

  guest:
    start: 50
    limit: 150
    leasetime: 1h

  tv:
    start: 5
    limit: 9
    leasetime: 12h

  work:
    start: 5
    limit: 9
    leasetime: 12h

firewall:
  defaults:
    input: REJECT
    output: ACCEPT
    forward: REJECT
    synflood_protect: 1

  zones:
    - name: wan
      input: REJECT
      output: ACCEPT
      forward: REJECT
      masq: 1
      mtu_fix: 1
      network:
        - wan

    - name: management
      input: ACCEPT
      output: ACCEPT
      forward: REJECT
      network:
        - management

    - name: server
      input: ACCEPT
      output: ACCEPT
      forward: REJECT
      network:
        - server

    - name: lan
      input: ACCEPT
      output: ACCEPT
      forward: REJECT
      network:
        - lan

    - name: iot
      input: REJECT
      output: ACCEPT
      forward: REJECT
      network:
        - iot

    - name: guest
      input: REJECT
      output: ACCEPT
      forward: REJECT
      network:
        - guest

    - name: tv
      input: REJECT
      output: ACCEPT
      forward: REJECT
      network:
        - tv

    - name: work
      input: REJECT
      output: ACCEPT
      forward: REJECT
      network:
        - work

  forwardings:
    - src: management
      dest: wan

    - src: server
      dest: wan

    - src: lan
      dest: wan

    - src: iot
      dest: wan

    - src: guest
      dest: wan

    - src: tv
      dest: wan

    - src: work
      dest: wan
