hostname: router1

system:
  hostname: router1
  timezone: UTC

network:
  lan:
    type: interface
    device: br-lan
    proto: static
    ipaddr: 192.168.10.1
    netmask: 255.255.255.0

  wan:
    type: interface
    device: eth0
    proto: dhcp

wireless:
  radios:
    radio0:
      type: mac80211
      channel: 11
      country: GB

  interfaces:
    wifi0:
      device: radio0
      mode: ap
      ssid: HomelabWiFi
      encryption: psk2
      key: changeme123

dhcp:
  lan:
    start: 100
    limit: 150
    leasetime: 12h
