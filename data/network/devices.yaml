    - id: office-switch-01
      label: office YuanLey
      model: YuanLey 6-port 2.5G
      role: unmanaged_access_switch
      zone: lan
      location: office

external_zones:
  - id: edge
    trust: controlled_external
    description: VPS or hosted systems connected to the wider architecture
    public_domain: bigalan.dev
    tailnet_membership_required: true
    private_admin_model: tailscale
    devices:
      - id: edge-proxy-01
        fqdn: edge-proxy-01.bigalan.dev
        private_fqdn: edge-proxy.tail.bigalan.dev
        role: public_reverse_proxy
        transport_to_homelab: tailscale
        tailscale:
          enabled: true
          tags: ["tag:edge-proxy"]
          ssh: true
          public_ssh_port_open: false
        notes:
          - Public TLS for bigalan.dev terminates here.
          - This node proxies selected HTTP services back into the homelab.
          - edge-proxy.tail.bigalan.dev tracks the node's Tailscale IP in private DNS.
